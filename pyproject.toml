[project]
name = "pay-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2",
  "pandas>=2.2",
  "pydantic>=2",
  "httpx>=0.27",
  "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["paydesk", "tests", "eval"]
